<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ragnarok Online MVP & Mini Boss Respawn Tracker</title>
  <style>
    :root {
      --bg-color: #080a10;
      --card-bg: rgba(12, 16, 28, 0.88);
      --card-border: rgba(180, 215, 255, 0.25);
      --border-color: #2a2f45;
      --accent-color: #5c80bc;
      --accent-glow: rgba(147, 180, 240, 0.5);
      --text-main: #c9d1d9;
      --text-bright: #ffffff;
      --overdue-color: #ff5252;
      --window-color: #ffd166;
      --active-color: #06d6a0;
      --sidebar-width: 280px;
      --valkyrie-white: #e0f2fe;
      --valkyrie-gold: #f4d06f;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', 'Segoe UI', sans-serif; }
    
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      font-size: 13px; 
      overflow-x: hidden;
      min-height: 100vh;
      background-image: 
        linear-gradient(rgba(8, 10, 16, 0.45), rgba(8, 10, 16, 0.55)),
        url("valkyrie.jpg");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Hide spin buttons globally */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* App Layout */
    .app-layout {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 20px;
      margin-right: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
    }

    /* Right Sidebar Controls */
    .right-sidebar {
      width: var(--sidebar-width);
      background: rgba(10, 12, 20, 0.92);
      backdrop-filter: blur(14px);
      border-left: 1px solid var(--card-border);
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.8);
      padding: 18px 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: fixed;
      right: 0;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 90;
      box-sizing: border-box;
    }

    .sidebar-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .nav-tabs { display: flex; flex-direction: column; gap: 6px; }
    .tab-btn { 
      background: rgba(25, 29, 45, 0.7); 
      color: var(--text-main); 
      border: 1px solid var(--card-border); 
      padding: 9px 12px; 
      cursor: pointer; 
      border-radius: 5px; 
      font-weight: bold; 
      text-align: left; 
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background: rgba(45, 53, 80, 0.8);
      color: #fff;
    }
    .tab-btn.active { 
      background: linear-gradient(135deg, rgba(74, 111, 165, 0.85), rgba(40, 70, 120, 0.95)); 
      color: #fff; 
      border-color: rgba(180, 215, 255, 0.5);
      box-shadow: 0 0 14px var(--accent-glow);
    }
    
    .search-box { width: 100%; }
    .search-box input { 
      width: 100%; 
      background: rgba(10, 12, 18, 0.85); 
      border: 1px solid var(--card-border); 
      color: #fff; 
      padding: 8px 10px; 
      border-radius: 5px;
      transition: border 0.2s;
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    
    .server-time-box { 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      background: rgba(10, 12, 18, 0.7); 
      padding: 10px; 
      border-radius: 5px; 
      border: 1px solid var(--card-border); 
      align-items: center; 
      text-align: center; 
    }
    .server-time-box label { font-size: 11px; color: #8892b0; font-weight: bold; }
    .server-time-box select { 
      background: #181a26; 
      color: #fff; 
      border: 1px solid var(--border-color); 
      border-radius: 3px; 
      font-size: 11px; 
      padding: 4px; 
      width: 100%; 
    }
    .server-clock { 
      font-family: monospace; 
      font-weight: bold; 
      color: var(--valkyrie-gold); 
      font-size: 17px; 
      margin-top: 2px;
      text-shadow: 0 0 10px rgba(244, 208, 111, 0.4);
    }
    
    .io-group { display: flex; gap: 6px; }
    .io-group .io-btn { flex: 1; }

    .io-btn, .add-btn, .mode-btn { 
      background: rgba(40, 46, 68, 0.8); 
      color: #fff; 
      border: 1px solid var(--card-border); 
      padding: 8px 10px; 
      border-radius: 5px; 
      cursor: pointer; 
      font-size: 11px; 
      font-weight: bold; 
      width: 100%; 
      text-align: center;
      transition: all 0.2s ease;
    }
    .io-btn:hover, .add-btn:hover, .mode-btn:hover { 
      filter: brightness(1.2);
      box-shadow: 0 0 12px rgba(255,255,255,0.15);
    }
    .add-btn { 
      background: linear-gradient(135deg, #1b5e20, #2e7d32); 
      border-color: #388e3c; 
    }
    .mode-btn { 
      background: linear-gradient(135deg, #bf360c, #e65100); 
      border-color: #f57c00; 
    }

    /* Grid Layout */
    .boss-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
      gap: 16px; 
    }
    
    /* MVP Card Style */
    .card { 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border); 
      border-radius: 8px; 
      padding: 12px 14px; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      position: relative; 
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(180, 215, 255, 0.6);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 18px var(--accent-glow);
    }
    .card.overdue { 
      border-color: var(--overdue-color); 
      box-shadow: 0 0 18px rgba(255, 77, 77, 0.4);
    }
    .card.overdue:hover {
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 22px rgba(255, 77, 77, 0.7);
    }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
    .boss-title-container { display: flex; align-items: center; gap: 6px; flex-grow: 1; }
    .boss-name-display { 
      color: var(--text-bright); 
      font-weight: bold; 
      font-size: 14px; 
      cursor: pointer; 
      transition: color 0.2s;
    }
    .boss-name-display:hover { color: var(--valkyrie-white); text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
    
    .boss-type-tag { font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: bold; letter-spacing: 0.5px; }
    .boss-type-tag.mvp { background: linear-gradient(135deg, #6a1b9a, #8e24aa); color: #fff; box-shadow: 0 0 6px rgba(142, 36, 170, 0.4); }
    .boss-type-tag.mini { background: linear-gradient(135deg, #0277bd, #0288d1); color: #fff; box-shadow: 0 0 6px rgba(2, 136, 209, 0.4); }
    
    .map-display { font-size: 11px; color: #8892b0; text-align: right; font-weight: 500; }
    .card-body { display: flex; gap: 12px; align-items: center; }
    
    .mvp-icon { 
      width: 54px; 
      height: 54px; 
      background: rgba(10, 12, 18, 0.85); 
      border-radius: 6px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 11px; 
      font-weight: bold; 
      color: var(--accent-color); 
      overflow: hidden; 
      border: 1px solid var(--card-border); 
      flex-shrink: 0; 
      text-transform: uppercase; 
      text-align: center; 
      cursor: pointer; 
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.6);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .mvp-icon:hover {
      border-color: var(--valkyrie-gold);
      box-shadow: inset 0 0 8px rgba(244, 208, 111, 0.3);
    }
    .mvp-icon img { width: 100%; height: 100%; object-fit: contain; }
    
    .timer-info { flex-grow: 1; }
    .window-tag { font-size: 11px; color: #8892b0; margin-bottom: 2px; display: flex; align-items: center; gap: 3px; }
    .respawn-time-tag { font-size: 11px; color: #82aaff; font-weight: bold; margin-bottom: 4px; }
    
    .live-timer { font-size: 19px; font-weight: bold; font-family: monospace; color: var(--active-color); text-shadow: 0 0 8px rgba(6, 214, 160, 0.4); }
    .live-timer.overdue { color: var(--overdue-color); text-shadow: 0 0 10px rgba(255, 77, 77, 0.6); animation: pulse 1s infinite alternate; }
    .live-timer.in-window { color: var(--window-color); text-shadow: 0 0 10px rgba(255, 209, 102, 0.6); }
    
    .window-num-input { 
      width: 38px; 
      background: rgba(10, 12, 18, 0.85); 
      border: 1px solid var(--card-border); 
      color: #a0aec0; 
      font-size: 11px; 
      text-align: center; 
      border-radius: 3px;
      padding: 1px;
    }
    .window-num-input:focus { border-color: var(--accent-color); background: #13141f; color: #fff; outline: none; }
    
    .reset-window-btn {
      background: rgba(40, 46, 68, 0.6);
      color: #8892b0;
      border: 1px solid var(--card-border);
      border-radius: 3px;
      font-size: 10px;
      padding: 1px 4px;
      cursor: pointer;
      margin-left: 2px;
      transition: all 0.2s;
    }
    .reset-window-btn:hover { background: var(--accent-color); color: #fff; }

    /* Time Input Container Styling */
    .manual-time-container { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
    .manual-time-container label { font-size: 11px; color: #8892b0; margin-right: 2px; }
    .time-input-group { display: flex; align-items: center; gap: 2px; }
    .time-field { 
      width: 26px; 
      background: rgba(10, 12, 18, 0.85); 
      border: 1px solid var(--card-border); 
      color: #fff; 
      text-align: center; 
      font-family: monospace; 
      border-radius: 3px; 
      padding: 3px 0; 
      font-size: 12px; 
      transition: border 0.2s, box-shadow 0.2s;
    }
    .time-field:focus { border-color: var(--accent-color); outline: none; box-shadow: 0 0 8px var(--accent-glow); }
    .colon-sep { color: #8892b0; font-weight: bold; font-family: monospace; }
    
    .ampm-btn {
      background: rgba(40, 46, 68, 0.8);
      border: 1px solid var(--card-border);
      color: var(--valkyrie-gold);
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 5px;
      border-radius: 3px;
      cursor: pointer;
      margin-left: 2px;
      transition: all 0.2s;
    }
    .ampm-btn:hover, .ampm-btn:focus { border-color: var(--accent-color); outline: none; background: rgba(60, 70, 100, 0.9); }

    /* Action Buttons */
    .card-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
    .action-btn { background: #2a2f45; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: background 0.2s, transform 0.1s; }
    .action-btn:hover { background: #3b4260; transform: translateY(-1px); }
    .action-btn:active { transform: translateY(0); }
    .reset-btn { background: #1b5e20; }
    .reset-btn:hover { background: #2e7d32; }
    .clear-btn { background: #b71c1c; }
    .clear-btn:hover { background: #c62828; }
    .boss-gear-btn { background: #2a2f45; padding: 5px 8px; border-radius: 4px; cursor: pointer; border: none; color: #fff; font-size: 12px; transition: all 0.2s; }
    .boss-gear-btn:hover { background: var(--accent-color); transform: translateY(-1px); }
    .track-toggle { flex-grow: 1; padding: 6px; font-weight: bold; }

    /* Modal Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 200; }
    .modal-content { background: #161927; border: 1px solid var(--card-border); padding: 20px; border-radius: 8px; width: 360px; max-width: 90vw; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(180, 215, 255, 0.15); }
    .modal-content h3 { color: var(--valkyrie-white); margin-bottom: 5px; font-size: 15px; }
    .modal-content label { font-size: 11px; color: #8892b0; display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .modal-content input, .modal-content select { background: #0d0e14; border: 1px solid var(--card-border); color: #fff; padding: 7px 9px; border-radius: 4px; font-size: 12px; width: 100%; box-sizing: border-box; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 5px; }
    
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }
  </style>
</head>
<body>

  <div class="app-layout">
    <main id="mainContent" class="main-content">
      <div id="bossGrid" class="boss-grid"></div>
    </main>

    <aside id="rightSidebar" class="right-sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search Boss or Map..." oninput="render()">
      </div>

      <div class="nav-tabs">
        <button class="tab-btn active" id="tab-farm" onclick="switchTab('farm')">My Farm List</button>
        <button class="tab-btn" id="tab-mvp" onclick="switchTab('mvp')">MVP Catalog</button>
        <button class="tab-btn" id="tab-mini" onclick="switchTab('mini')">Mini Boss Catalog</button>
      </div>

      <div class="sidebar-group">
        <button id="modeBtn" class="mode-btn" onclick="toggleTimeMode()"> Server Time Mode</button>
        <div class="server-time-box">
          <label id="tzLabel" for="utcSelect">Server TZ:</label>
          <select id="utcSelect" onchange="updateServerTimezone(this.value)">
            <option value="-12">UTC -12 (Baker Island)</option>
            <option value="-11">UTC -11 (American Samoa / Niue)</option>
            <option value="-10">UTC -10 (Hawaii / HST)</option>
            <option value="-9">UTC -9 (Alaska / AKST)</option>
            <option value="-8">UTC -8 (Pacific Time / PST)</option>
            <option value="-7">UTC -7 (Mountain Time / MST)</option>
            <option value="-6">UTC -6 (Central Time / CST)</option>
            <option value="-5">UTC -5 (Eastern Time / EST)</option>
            <option value="-4">UTC -4 (Atlantic Time / AST / Manaus)</option>
            <option value="-3">UTC -3 (Brazil / Argentina / ART)</option>
            <option value="-2">UTC -2 (South Georgia / Mid-Atlantic)</option>
            <option value="-1">UTC -1 (Azores / Cape Verde)</option>
            <option value="0">UTC +0 (GMT / London / Lisbon)</option>
            <option value="1">UTC +1 (Central Europe / CET / Paris / Berlin)</option>
            <option value="2">UTC +2 (Eastern Europe / EET / Cairo / Athens)</option>
            <option value="3">UTC +3 (Moscow / Istanbul / Saudi Arabia)</option>
            <option value="4">UTC +4 (Dubai / UAE / Gulf Standard)</option>
            <option value="5">UTC +5 (Pakistan / PKT / Tashkent)</option>
            <option value="6">UTC +6 (Bangladesh / BST / Astana)</option>
            <option value="7">UTC +7 (Thailand / Vietnam / Jakarta / ICT)</option>
            <option value="8" selected>UTC +8 (Philippines / SG / China / PHT)</option>
            <option value="9">UTC +9 (Japan / South Korea / JST / KST)</option>
            <option value="10">UTC +10 (Australian Eastern / AEST / Guam)</option>
            <option value="11">UTC +11 (Solomon Islands / New Caledonia)</option>
            <option value="12">UTC +12 (New Zealand / Fiji / NZST)</option>
            <option value="13">UTC +13 (Tonga / Phoenix Islands)</option>
            <option value="14">UTC +14 (Line Islands / Kiritimati)</option>
          </select>
          <span id="serverClock" class="server-clock">00:00:00</span>
        </div>
      </div>

      <div class="sidebar-group">
        <button class="add-btn" onclick="openAddModal()"> Add Boss</button>
      </div>

      <div class="io-group">
        <button class="io-btn" onclick="exportData()"> Export</button>
        <button class="io-btn" onclick="importData()"> Import</button>
      </div>
    </aside>
  </div>

  <!-- Add Boss Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <h3>Add Custom Boss</h3>
      <label>
        Type:
        <select id="newBossType">
          <option value="mvp">MVP</option>
          <option value="mini" selected>Mini Boss</option>
        </select>
      </label>
      <label>
        Boss Name:
        <input type="text" id="newBossName" placeholder="e.g. Maya Purple (Custom)">
      </label>
      <label>
        Map Name:
        <input type="text" id="newBossMap" placeholder="e.g. gld_dun03">
      </label>
      <div style="display:flex; gap:10px; width: 100%;">
        <label style="flex:1; width:50%;">
          Min Window (mins):
          <input type="number" id="newBossMin" value="60">
        </label>
        <label style="flex:1; width:50%;">
          Max Window (mins):
          <input type="number" id="newBossMax" value="70">
        </label>
      </div>
      <label>
        Image URL (Direct Link ending in .png/.jpg):
        <input type="text" id="newBossImg" placeholder="https://.../boss.png">
      </label>
      <div class="modal-actions">
        <button class="action-btn" onclick="closeAddModal()">Cancel</button>
        <button class="action-btn reset-btn" onclick="saveNewBoss()">Save Boss</button>
      </div>
    </div>
  </div>

  <!-- Boss Settings Modal -->
  <div id="bossSettingsModal" class="modal">
    <div class="modal-content">
      <h3 id="bossSettingsTitle">&#9881; Boss Settings</h3>
      <input type="hidden" id="editBossId">
      <label>
        Boss Name:
        <input type="text" id="editBossName">
      </label>
      <label>
        Map Name:
        <input type="text" id="editBossMap">
      </label>
      <div style="display:flex; gap:10px; width: 100%;">
        <label style="flex:1; width:50%;">
          Min Window (mins):
          <input type="number" id="editBossMin">
        </label>
        <label style="flex:1; width:50%;">
          Max Window (mins):
          <input type="number" id="editBossMax">
        </label>
      </div>
      <label>
        Custom Image URL:
        <input type="text" id="editBossImg" placeholder="https://.../boss.png">
      </label>
      <div class="modal-actions" style="justify-content: space-between;">
        <button class="action-btn" style="background:#555;" onclick="resetBossSettingsToDefault()">Restore Default</button>
        <div>
          <button class="action-btn" onclick="closeBossSettingsModal()">Cancel</button>
          <button class="action-btn reset-btn" onclick="saveBossSettings()">Save</button>
        </div>
      </div>
    </div>
  </div>

    let currentTab = 'farm';

      tracked: ["baphomet", "eddga", "angeling", "ghostring"],
      serverUtcOffset: 8,
      displayMode: 'server',
      customData: {},
      customBosses: []
    };

    if (state.serverUtcOffset === undefined) state.serverUtcOffset = 8;
    if (!state.customBosses) state.customBosses = [];

    function saveState() {
      localStorage.setItem('ro_mvp_state', JSON.stringify(state));
    }

    function toggleTimeMode() {
      state.displayMode = state.displayMode === 'server' ? 'local' : 'server';
      saveState();
      render();
    }

    function updateServerTimezone(val) {
      state.serverUtcOffset = parseFloat(val);
      saveState();
      render();
    }

    function getTargetTime() {
      const now = new Date();
      if (state.displayMode === 'local') {
        return now;
      }
      const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utcMs + (3600000 * state.serverUtcOffset));
    }

    function updateServerClock() {
      const sDate = getTargetTime();
      const h = String(sDate.getHours()).padStart(2, '0');
      const m = String(sDate.getMinutes()).padStart(2, '0');
      const s = String(sDate.getSeconds()).padStart(2, '0');
      document.getElementById('serverClock').innerText = `${h}:${m}:${s}`;
    }

    function playChime(freq = 587.33) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {
        console.log("Audio blocked");
      }
    }

    function exportData() {
      const dataStr = JSON.stringify(state);
      navigator.clipboard.writeText(dataStr).then(() => {
        alert("State copied to clipboard!");
      }).catch(() => {
        prompt("Copy state code manually:", dataStr);
      });
    }

    function importData() {
      const input = prompt("Paste exported state code here:");
      if (!input) return;
      try {
        const parsed = JSON.parse(input);
        if (parsed.tracked && parsed.customData) {
          state = parsed;
          if (!state.customBosses) state.customBosses = [];
          if (!state.displayMode) state.displayMode = 'server';
          saveState();
          document.getElementById('utcSelect').value = state.serverUtcOffset;
          render();
          alert("Import successful!");
        } else { alert("Invalid data format!"); }
      } catch (e) { alert("Failed to parse data!"); }
    }

      return {
        name: custom.name || boss.name,
        map: custom.map || boss.map,
        type: boss.type || "mvp",
        minWindow: custom.minWindow !== undefined ? custom.minWindow : boss.minWindow,
        maxWindow: custom.maxWindow !== undefined ? custom.maxWindow : boss.maxWindow,
        imageUrl: custom.imageUrl || boss.imageUrl || null,
        killTime: custom.killTime || null

    /* Auto-Jumping Time Input Handlers with Smooth Focus Locks */
    function handleHourInput(elem, id) {
      elem.value = elem.value.replace(/[^0-9]/g, '');
      if (elem.value.length >= 2) {
        let val = parseInt(elem.value, 10);
        if (val > 12) elem.value = '12';
        if (val === 0) elem.value = '12';
        const minElem = document.getElementById(`min_${id}`);
        if (minElem) {
          minElem.focus();
          minElem.select();
        }
      }
    }

    function handleMinInput(elem, id, event) {
      if (event.key === 'Backspace' && elem.value.length === 0) {
        const hrElem = document.getElementById(`hr_${id}`);
        if (hrElem) {
          hrElem.focus();
          hrElem.select();
        }
        return;
      }
      elem.value = elem.value.replace(/[^0-9]/g, '');
      if (elem.value.length >= 2) {
        let val = parseInt(elem.value, 10);
        if (val > 59) elem.value = '59';
        const ampmBtn = document.getElementById(`ampm_${id}`);
        if (ampmBtn) ampmBtn.focus();
      }
    }

    function handleAmPmKey(elem, id, event) {
      const key = event.key.toLowerCase();
      if (key === 'a') {
        elem.innerText = 'AM';
        saveManualTime(id);
      } else if (key === 'p') {
        elem.innerText = 'PM';
        saveManualTime(id);
      } else if (event.key === 'Enter') {
        saveManualTime(id);
      }
    }

    function toggleAmPm(id) {
      const btn = document.getElementById(`ampm_${id}`);
      if (!btn) return;
      btn.innerText = btn.innerText === 'AM' ? 'PM' : 'AM';
      saveManualTime(id);
    }

    function saveManualTime(id) {
      const hrElem = document.getElementById(`hr_${id}`);
      const minElem = document.getElementById(`min_${id}`);
      const ampmBtn = document.getElementById(`ampm_${id}`);
      if (!hrElem || !minElem || !ampmBtn) return;

      let hrs = parseInt(hrElem.value, 10);
      let mins = parseInt(minElem.value, 10);
      if (isNaN(hrs) || isNaN(mins)) return;

      const ampm = ampmBtn.innerText.trim().toUpperCase();
      if (ampm === 'PM' && hrs < 12) hrs += 12;
      if (ampm === 'AM' && hrs === 12) hrs = 0;

      const targetNow = getTargetTime();
      const targetTimeObj = new Date(targetNow.getTime());
      targetTimeObj.setHours(hrs, mins, 0, 0);
      if (targetTimeObj.getTime() > targetNow.getTime()) {
        targetTimeObj.setDate(targetTimeObj.getDate() - 1);
      }
      const offsetMs = (targetNow.getTime() - Date.now());
      const localEpoch = targetTimeObj.getTime() - offsetMs;
      
      if (!state.customData[id]) state.customData[id] = {};
      state.customData[id].killTime = localEpoch;
      alertedBosses.delete(id);
      saveState();
      isEditingInput = false;
      render();
    }

    function formatTimeWindow(dateObj) {
      let h = dateObj.getHours();
      const m = String(dateObj.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      h = h ? h : 12;
      return {
        hh: String(h).padStart(2, '0'),
        mm: m,
        ampm: ampm,
        fullStr: `${String(h).padStart(2, '0')}:${m} ${ampm}`
      };
    }

    function calculateTimes(boss) {
      const data = getBossData(boss);
      if (!data.killTime) return { nextMinMs: Infinity, displayStr: "--:--:--", status: "none", killObj: null, spawnWindowStr: "--:-- - --:--" };
      const minSpawnTime = data.killTime + (data.minWindow * 60000);
      const maxSpawnTime = data.killTime + (data.maxWindow * 60000);
      const now = Date.now();
      const diff = minSpawnTime - now;
      const localKillDate = new Date(data.killTime);
      const localMinDate = new Date(minSpawnTime);
      const localMaxDate = new Date(maxSpawnTime);
      let killDateObj = localKillDate;
      let minDateObj = localMinDate;
      let maxDateObj = localMaxDate;

      if (state.displayMode === 'server') {
        const getUtcServerDate = (d) => {
          const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
          return new Date(utc + (3600000 * state.serverUtcOffset));
        };
        killDateObj = getUtcServerDate(localKillDate);
        minDateObj = getUtcServerDate(localMinDate);
        maxDateObj = getUtcServerDate(localMaxDate);
      }

      const killObj = formatTimeWindow(killDateObj);
      const minObj = formatTimeWindow(minDateObj);
      const maxObj = formatTimeWindow(maxDateObj);
      const spawnWindowStr = `${minObj.fullStr} - ${maxObj.fullStr}`;

      if (diff <= 0) {
        const overdueMs = Math.abs(diff);
        const status = now > maxSpawnTime ? "overdue" : "in-window";
        
        if (!alertedBosses.has(boss.id)) {
          alertedBosses.add(boss.id);
          playChime(880);
        }
        return { nextMinMs: minSpawnTime, displayStr: `+${formatMs(overdueMs)}`, status, killObj, spawnWindowStr };
      }
      return { nextMinMs: minSpawnTime, displayStr: formatMs(diff), status: "active", killObj, spawnWindowStr };
    }

    function formatMs(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

      const initials = bossName.split(' ').map(w => w[0]).join('').substring(0, 3).toUpperCase();

    }

              <div class="live-timer ${timing.status}">${timing.displayStr}</div>
              <div class="respawn-time-tag"> Respawn: ${timing.spawnWindowStr}</div>
              ${currentTab === 'farm' ? `
                <div class="manual-time-container">
                  <label>${inputLabelStr}</label>
                  <div class="time-input-group">
                    <input type="text" id="hr_${boss.id}" class="time-field" placeholder="HH" maxlength="2" value="${currentHr}"
                      onfocus="isEditingInput=true" onblur="isEditingInput=false"
                      oninput="handleHourInput(this, '${boss.id}')">
                    <span class="colon-sep">:</span>
                    <input type="text" id="min_${boss.id}" class="time-field" placeholder="MM" maxlength="2" value="${currentMin}"
                      onfocus="isEditingInput=true" onblur="isEditingInput=false"
                      onkeyup="handleMinInput(this, '${boss.id}', event)">
                    <button type="button" id="ampm_${boss.id}" class="ampm-btn"
                      onfocus="isEditingInput=true" onblur="isEditingInput=false"
                      onclick="toggleAmPm('${boss.id}')"
                      onkeydown="handleAmPmKey(this, '${boss.id}', event)">${currentAmPm}</button>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
          <div class="card-actions">
            <button class="boss-gear-btn" title="Edit Boss Settings" onclick="openBossSettings('${boss.id}')">&#9881;</button>
            ${currentTab === 'farm' ? `
              <button class="action-btn reset-btn" title="Quick Reset Kill Timer" onclick="resetTimer('${boss.id}')"> Reset</button>
              <button class="action-btn clear-btn" title="Clear Kill Timer" onclick="clearTimer('${boss.id}')"> Clear</button>
            ` : `
              <button class="action-btn track-toggle ${isTracked ? 'clear-btn' : 'reset-btn'}" onclick="toggleTrack('${boss.id}')">
                ${isTracked ? 'Remove from Farm' : '+ Add to Farm'}
              </button>
              ${boss.isCustom ? `<button class="action-btn clear-btn" title="Delete Boss" onclick="deleteCustomBoss('${boss.id}')"></button>` : ''}
            `}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    setInterval(() => {
      updateServerClock();
      if (currentTab === 'farm' && !isEditingInput) {
        render();
      }
    }, 1000);

    render();
  </script>
</body>
</html>
